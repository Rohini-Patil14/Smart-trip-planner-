<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* BACKGROUND */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0f4c75, #3282b8);
}

/* LOGIN CARD */
.login-box{
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding:40px;
    border-radius:15px;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
    color:white;
}

/* TITLE */
.login-box h2{
    margin-bottom:25px;
    font-size:28px;
}

/* INPUT BOX */
.input-box{
    position:relative;
    margin:20px 0;
}

.input-box input{
    width:100%;
    padding:12px 40px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

/* ICON */
.input-box i{
    position:absolute;
    top:50%;
    left:12px;
    transform:translateY(-50%);
    color:#555;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ff7b00;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff9d3c;
    transform:scale(1.05);
}

/* ERROR */
.error{
    margin-top:15px;
    color:#ff4d4d;
    font-size:14px;
}

/* FOOTER */
.footer{
    margin-top:15px;
    font-size:13px;
    opacity:0.8;
}

</style>
</head>

<body>

<div class="login-box">

    <h2><i class="fa fa-user-shield"></i> Admin Login</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="input-box">
            <i class="fa fa-user"></i>
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <i class="fa fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <p class="error">{{ error }}</p>

</div>

</body>
</html>
