<!DOCTYPE html>
<html>
<head>

<title>Travel Packages</title>

<style>

body{font-family:Arial;margin:0}

.packages{
padding:50px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

button{
background:#ff7b00;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
}

</style>

</head>

<body>

<h2 style="text-align:center">Travel Packages</h2>

<div class="packages">

<div class="card">
<h3>Goa Package</h3>
<p>3 Days / 2 Nights</p>
<p>₹8000</p>
<button>Book</button>
</div>

<div class="card">
<h3>Manali Package</h3>
<p>5 Days / 4 Nights</p>
<p>₹15000</p>
<button>Book</button>
</div>

<div class="card">
<h3>Kashmir Package</h3>
<p>6 Days</p>
<p>₹20000</p>
<button>Book</button>
</div>

</div>

</body>
</html>
