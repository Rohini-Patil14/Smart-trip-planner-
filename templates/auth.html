<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner - Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:380px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    color:white;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.input-box{
    position:relative;
    margin:15px 0;
}
*{
    box-sizing: border-box;
}
.input-box input{
    width:100%;
    padding:12px 40px 12px 12px;
    border:none;
    border-radius:8px;
    outline:none;
    box-sizing:border-box;   /* IMPORTANT */
}

.input-box i{
    position:absolute;
    right:12px;
    top:12px;
    color:#333;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#ff7b00;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff5500;
}

.toggle{
    text-align:center;
    margin-top:15px;
    cursor:pointer;
}

.toggle span{
    color:#ffd700;
    font-weight:bold;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="container">

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <h2>Sign In</h2>

        <div class="input-box">
            <input type="email" placeholder="Email">
            <i class="fa fa-envelope"></i>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Password">
            <i class="fa fa-lock"></i>
        </div>

        <button onclick="login()">Login</button>

        <div class="toggle" onclick="showRegister()">
            Don't have account? <span>Sign Up</span>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="hidden">
        <h2>Sign Up</h2>

        <div class="input-box">
            <input type="text" placeholder="Full Name">
            <i class="fa fa-user"></i>
        </div>

        <div class="input-box">
            <input type="email" placeholder="Email">
            <i class="fa fa-envelope"></i>
        </div>

        {% comment %} <div class="input-box">
            <input type="password" placeholder="Password">
            <i class="fa fa-lock"></i>
        </div>

        <div class="input-box">
            <input type="password" placeholder="Confirm Password">
            <i class="fa fa-lock"></i>
        </div> {% endcomment %}
        <!-- Register Password -->
<div class="input-box">
    <input type="password" id="regPassword" placeholder="Password">
    <i class="fa fa-eye" onclick="togglePassword('regPassword', this)"></i>
</div>

<!-- Confirm Password -->
<div class="input-box">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <i class="fa fa-eye" onclick="togglePassword('confirmPassword', this)"></i>
</div>
        <button onclick="register()">Register</button>

        <div class="toggle" onclick="showLogin()">
            Already have account? <span>Login</span>
        </div>
    </div>

</div>

<script>

    // Toggle forms
    function showRegister(){
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("registerForm").classList.remove("hidden");
    }
    
    function showLogin(){
        document.getElementById("registerForm").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");
    }
    
    // 👁️ SHOW / HIDE PASSWORD
    function togglePassword(id, icon){
        let input = document.getElementById(id);
    
        if(input.type === "password"){
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        }else{
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
    
    // LOGIN VALIDATION
    function login(){
        let password = document.getElementById("loginPassword").value;
    
        if(password === ""){
            alert("Please enter password");
            return;
        }
    
        alert("Login Successful (Demo)");
        window.location.href="/";
    }
    
    // REGISTER VALIDATION
    function register(){
        let pass = document.getElementById("regPassword").value;
        let confirm = document.getElementById("confirmPassword").value;
    
        if(pass === "" || confirm === ""){
            alert("Please fill all fields");
            return;
        }
    
        if(pass !== confirm){
            alert("Passwords do not match");
            return;
        }
    
        if(pass.length < 6){
            alert("Password must be at least 6 characters");
            return;
        }
    
        alert("Registration Successful");
        showLogin();
    }
    
    </script>

</body>
</html>
