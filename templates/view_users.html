{% extends 'admin_base.html' %}

{% block content %}

<div style="display:flex; justify-content:center; margin-top:40px;">

<div style="width:90%; max-width:1000px;">

<h2 style="text-align:center; color:#0f4c75;">All Users</h2>

<div style="overflow-x:auto;">
<table style="width:100%; background:white; box-shadow:0 5px 15px rgba(0,0,0,0.1); border-collapse:collapse; border-radius:10px; overflow:hidden;">

<tr style="background:#0f4c75; color:white;">
    <th style="padding:12px;">Username</th>
    <th style="padding:12px;">Email</th>
    <th style="padding:12px;">Phone</th>
    <th style="padding:12px;">Photo</th>
    <th style="padding:12px;">Action</th>
</tr>

{% for u in users %}
<tr style="text-align:center; border-bottom:1px solid #ddd;">

    <td style="padding:10px;">{{ u.username }}</td>
    <td style="padding:10px;">{{ u.email }}</td>
    <td style="padding:10px;">{{ u.userprofile.phone }}</td>

    <td style="padding:10px;">
        {% if u.userprofile.photo %}
            <img src="{{ u.userprofile.photo.url }}" width="60" style="border-radius:5px;">
        {% endif %}
    </td>

    <td style="padding:10px;">
        <a href="{% url 'edit_user' u.id %}" 
   style="background:#3282b8; color:white; padding:6px 12px; border-radius:5px; text-decoration:none; margin-right:8px;">
   Edit
</a>

<a href="{% url 'delete_user' u.id %}"
   onclick="return confirm('Delete user?')"
   style="background:red; color:white; padding:6px 12px; border-radius:5px; text-decoration:none;">
   Delete
</a>
    </td>

</tr>
{% endfor %}

</table>
</div>

</div>
</div>

{% endblock %}
