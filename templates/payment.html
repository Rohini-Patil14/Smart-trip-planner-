<!DOCTYPE html>
<html>
<head>
<title>Payment</title>

<style>
body{
    font-family:Arial;
    background:#eef3f8;
}

.box{
    width:400px;
    margin:100px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
}

.option{
    padding:10px;
    margin:10px;
    border:1px solid #ccc;
    cursor:pointer;
}

.btn{
    background:#0f4c75;
    color:white;
    padding:10px;
    border:none;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>Payment 💳</h2>

<p><b>Total Amount:</b> ₹{{ amount }}</p>

<form action="/booking/" method="get">

<input type="hidden" name="place" value="{{ place }}">
<input type="hidden" name="hotel" value="{{ hotel }}">
<input type="hidden" name="vehicle" value="{{ vehicle }}">
<input type="hidden" name="date" value="{{ date }}">

<h3>Select Payment Method</h3>

<label class="option">
<input type="radio" name="payment" value="gpay" required> Google Pay
</label>

<label class="option">
<input type="radio" name="payment" value="cash"> Cash
</label>

<br><br>

<button type="submit" class="btn">Pay & Book ✅</button>

</form>

</div>

</body>
</html>
