<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body{
    font-family:Arial;
    background:#0f4c75;
}

.form-box{
    width:350px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
}
.logo{
    width:80px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    width:100%;
    padding:10px;
    background:#ff7b00;
    color:white;
    border:none;
}
h2{
    text-align:center;
}
</style>
</head>

<body>

<div class="form-box">
    <img src="/static/logo.png" class="logo">
<h2>Register</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<input type="text" name="username" placeholder="Username" required>
<input type="email" name="email" placeholder="Email (optional)">
<input type="text" name="phone" placeholder="Phone" required>
<input type="text" name="address" placeholder="Address" required>
<input type="file" name="photo">

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

<p style="color:red">{{ error }}</p>

<a href="/ulogin">Already have account? Login</a>

</div>

</body>
</html>
