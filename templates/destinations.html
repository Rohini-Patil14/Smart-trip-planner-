 <!DOCTYPE html>
<html>
<head>
<title>Destinations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

body{font-family:Arial;margin:0;background:#f5f7fb}

.destination-grid{
display:grid;

.card{
background:white;

.card img{
width:100%;
height:180px;
object-fit:cover;

.card h3{
padding:15px;
}
.search-box{
    text-align:center;
    margin:20px;
    }
    
    .search-box input{
    width:300px;
    padding:10px;
    border-radius:5px;
    border:1px solid #ccc;

    .filters{
        text-align:center;
        margin:20px;

<body>

    </div>

    <script>
        function searchDestination(){
            let input = document.getElementById("searchInput").value.toLowerCase();
            let cards = document.getElementsByClassName("card");
        
            for(let i=0; i<cards.length; i++){
                let title = cards[i].getElementsByTagName("h3")[0].innerText.toLowerCase();
        
                if(title.includes(input)){
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
        </script>

        <script>
            function filterData(){
            
                let budget = document.getElementById("budget").value;
                let rating = document.getElementById("rating").value;
                let type = document.getElementById("type").value;
            
                let cards = document.getElementsByClassName("card");
            
                for(let i=0; i<cards.length; i++){
            
                    let cBudget = cards[i].getAttribute("data-budget");
                    let cRating = cards[i].getAttribute("data-rating");
                    let cType = cards[i].getAttribute("data-type");
            
                    let show = true;
            
                    // Budget filter
                    if(budget && parseInt(cBudget) > parseInt(budget)){
                        show = false;
                    }
            
                    // Rating filter
                    if(rating && parseFloat(cRating) < parseFloat(rating)){
                        show = false;
                    }
            
                    // Type filter
                    if(type && cType !== type){
                        show = false;
                    }
            
                    cards[i].style.display = show ? "block" : "none";
                }
            }
            </script>
