<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
    font-family:Arial;
    background:#0f4c75;
}

.form-box{
    width:350px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:#ff7b00;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="form-box">

<h2>Login</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="username" placeholder="Username">
<input type="password" name="password" placeholder="Password">

<button type="submit">Login</button>

</form>

<p style="color:red">{{ error }}</p>

<a href="/uregister">Create Account</a>

</div>

</body>
</html>
