{% extends 'admin_base.html' %}

{% block content %}

<style>
    .container {
        background: white;
        padding: 30px;
        width: 400px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        margin: 40px auto;
    }

    h2 {
        text-align: center;
        color: #0f4c75;
    }

    input, textarea, select {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #0f4c75;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #3282b8;
    }

    .success {
        text-align: center;
        color: green;
        margin-top: 10px;
    }
</style>

<div class="container">

    <h2>Add Vehicle </h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Vehicle Name" required>

        <select name="type" required>
            <option value="">Select Type</option>
            <option value="Car">Car</option>
            <option value="Bus">Bus</option>
        </select>

        <input type="number" name="seats" placeholder="Seats" required>

        <input type="number" name="price" placeholder="Price per KM" required>

        <textarea name="description" placeholder="Description" required></textarea>

        <input type="file" name="image" required>

        <button type="submit">Add Vehicle</button>
    </form>

    <p class="success">{{ success }}</p>

</div>

{% endblock %}
