{% extends 'admin_base.html' %}

{% block content %}

<style>
/* GENERAL STYLES */
.container-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    background: white;
    padding: 40px 50px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 500px;
    width: 100%;
    text-align: center;
}

h2 {
    font-size: 32px;
    margin-bottom: 25px;
    color: #0f4c75;
}

/* FORM STYLES */
form input,
form textarea,
form select {
    width: 100%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    padding: 12px 25px;
    background: #0f4c75;
    color: white;
    border: none;
    border-radius: 8px;
}
</style>

<div class="container-wrapper">

<div class="container">
    <h2>Add Destination</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Name" required>

        <textarea name="description" placeholder="Description" required></textarea>

        <input type="text" name="distance" placeholder="Distance (km)">

        <input type="text" name="places" placeholder="Place 1">
        <input type="text" name="places" placeholder="Place 2">
        <input type="text" name="places" placeholder="Place 3">

        <select name="type" required>
            <option value="">Select Type</option>
            <option value="beach">Beach</option>
            <option value="city">City</option>
            <option value="hill">Hill</option>
        </select>

        <input type="file" name="images" multiple required>

        <button type="submit">Add</button>
    </form>

    <p>{{ success }}</p>
</div>

</div>

{% endblock %}
